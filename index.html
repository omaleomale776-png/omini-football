<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMINI FOOTBALL 11 VS 11</title>
<style>
body{margin:0;font-family:Arial;background:#0a5c26;color:white;text-align:center}
.header{background:#000;padding:15px;font-size:22px;font-weight:bold;border-bottom:4px solid gold}
#tapTitle{cursor:pointer}
.stadium{padding:20px}
.btn{background:gold;color:black;padding:18px 35px;font-size:20px;font-weight:bold;border:none;border-radius:10px;margin:10px;cursor:pointer;width:90%}
.btn-green{background:#00c853;color:white}
.pay-box{background:white;color:black;margin:20px;padding:20px;border-radius:15px}
#gameFrame{width:100%;height:600px;border:none;display:none}
</style>
</head>
<body>
<div class="header">
<div id="tapTitle" onclick="countTap()">OMINI FOOTBALL 11 VS 11</div>
<div style="font-size:12px;color:gold">WARRI - DELTA STATE STADIUM - 90 MINS</div>
</div>
<div id="homePage">
<div class="stadium">
<h2>OMINI ULTIMATE MATCH</h2>
<p>11 vs 11 Full Action<br>90 Minutes</p>
<div class="pay-box">
<h3 style="color:#0a5c26">Pay To Play N300</h3>
<button class="btn btn-green" onclick="payNow()">PAY N300 ON WHATSAPP</button>
<button class="btn" onclick="checkPay()">I HAVE PAID - PLAY NOW</button>
</div>
<p style="font-size:12px">Owner: Tap title 10 times fast for Admin</p>
</div>
</div>
<iframe id="gameFrame" src=""></iframe>
<script>
let taps=0, tapTimer;
function countTap(){
taps++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>{taps=0},3000);
document.getElementById('tapTitle').innerText=`TAPS: ${taps}/10`;
if(taps>=10){
let p=prompt("Enter Admin Password:");
if(p==="omiliadmin2026"){localStorage.setItem("omili_paid","yes"); alert("Admin Unlocked!"); playGame();}
else{alert("Wrong Password");}
taps=0;
}
setTimeout(()=>{document.getElementById('tapTitle').innerText="OMINI FOOTBALL 11 VS 11"},1000);
}
function payNow(){
let m=encodeURIComponent("Hello, I want to pay N300 for OMINI FOOTBALL");
window.open(`https://wa.me/2340000000000?text=${m}`,"_blank");
}
function checkPay(){
if(localStorage.getItem("omili_paid")==="yes"){playGame();}
else{alert("Pay N300 on WhatsApp first");}
}
function playGame(){
document.getElementById('homePage').style.display='none';
let f=document.getElementById('gameFrame'); f.style.display='block'; f.src='omini-ultimate.html';
}
</script>
</body>
  </html>
