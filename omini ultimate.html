<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMINI Match</title>
<style>
body{margin:0;background:#1a7a33;overflow:hidden;font-family:Arial;color:white;text-align:center}
.score{background:black;padding:10px;display:flex;justify-content:space-between}
#field{width:100%;height:85vh;position:relative;background:linear-gradient(#2e8a47,#1a7a33)}
#ball{width:28px;height:28px;background:white;border-radius:50%;position:absolute;left:50%;top:50%;border:2px solid black}
.player{width:35px;height:35px;background:green;border-radius:50%;position:absolute;line-height:35px;border:2px solid white}
.player.away{background:white;color:green}
.controls{position:absolute;bottom:10px;width:100%;display:flex;justify-content:center;gap:10px}
.cbtn{background:gold;color:black;padding:12px 20px;border-radius:20px;border:none;font-weight:bold}
</style>
</head>
<body>
<div class="score"><span>OMINI 0</span><span id="time">90:00</span><span>AWAY 0</span></div>
<div id="field">
<div id="ball"></div>
<div class="player" style="left:20%;top:40%">10</div>
<div class="player away" style="left:70%;top:50%">11</div>
</div>
<div class="controls">
<button class="cbtn" onclick="kick()">KICK</button>
<button class="cbtn" onclick="pass()">PASS</button>
<button class="cbtn" onclick="shoot()">SHOOT</button>
</div>
<script>
let bx=50,by=50;
function moveBall(dx,dy){bx+=dx;by+=dy;document.getElementById('ball').style.left=bx+'%';document.getElementById('ball').style.top=by+'%';}
function kick(){moveBall(Math.random()*20-10,Math.random()*20-10)}
function pass(){moveBall(15,0)}
function shoot(){moveBall(30,-10); alert("GOAL!!! OMINI!!!");}
let t=5400; setInterval(()=>{t--; let m=Math.floor(t/60); let s=t%60; document.getElementById('time').innerText=m+":"+(s<10?"0"+s:s)},1000);
</script>
</body>
</html>
